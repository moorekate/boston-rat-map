<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Boston Rat Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css"
  />

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>

  <div class="search-panel">

    <form id="address-search-form">

      <input
        id="address-search"
        type="text"
        placeholder="Search a Boston address"
        required
      />

      <button type="submit">
        Search
      </button>

    </form>

    <div id="search-message"></div>

  </div>

  <div id="map"></div>

  <script
    type="module"
    src="map.js"
  ></script>

</body>

</html>
